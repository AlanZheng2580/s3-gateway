services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: mock-weka-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: weka-admin-superkey
      MINIO_ROOT_PASSWORD: weka-admin-supersecret
      MINIO_REGION_NAME: us-east-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - s3lab

  minio-provisioner:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: mock-weka-minio-provisioner
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/scripts/provision-minio.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: weka-admin-superkey
      MINIO_ROOT_PASSWORD: weka-admin-supersecret
      MINIO_VGW_ADMIN_USER: versitygw-minio-admin
      MINIO_VGW_ADMIN_PASSWORD: versitygw-minio-admin-secret
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - s3lab
    restart: "no"

  versitygw:
    image: versity/versitygw:v1.7.0
    container_name: mock-weka-versitygw
    depends_on:
      minio-provisioner:
        condition: service_completed_successfully
    command:
      - --port
      - :7070
      - --admin-port
      - :7071
      - --webui
      - :8080
      - --webui-no-tls
      - --webui-gateways
      - http://localhost:7070
      - --webui-admin-gateways
      - http://localhost:7071
      - --cors-allow-origin
      - http://localhost:8080
      - --health
      - /health
      - --iam-dir
      - /var/lib/versitygw/iam
      - --access
      - weka-admin-superkey
      - --secret
      - weka-admin-supersecret
      - s3
      - --access
      - versitygw-minio-admin
      - --secret
      - versitygw-minio-admin-secret
      - --endpoint
      - http://minio:9000
      - --region
      - us-east-1
      - --meta-bucket
      - vgw-meta
      - --use-path-style
    ports:
      - "7070:7070"
      - "7071:7071"
      - "8080:8080"
    volumes:
      - versitygw-iam:/var/lib/versitygw/iam
    networks:
      - s3lab

  versitygw-user-provisioner:
    image: versity/versitygw:v1.7.0
    container_name: mock-weka-versitygw-user-provisioner
    depends_on:
      - versitygw
    entrypoint: ["/bin/sh", "/scripts/provision-versitygw-users.sh"]
    environment:
      VGW_ADMIN_ENDPOINT: http://versitygw:7071
      VGW_ROOT_ACCESS_KEY: weka-admin-superkey
      VGW_ROOT_SECRET_KEY: weka-admin-supersecret
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - s3lab
    restart: "no"

  versitygw-policy-provisioner:
    image: amazon/aws-cli:2.36.16
    container_name: mock-weka-versitygw-policy-provisioner
    depends_on:
      versitygw-user-provisioner:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/provision-versitygw-policies.sh"]
    environment:
      AWS_ACCESS_KEY_ID: weka-admin-superkey
      AWS_SECRET_ACCESS_KEY: weka-admin-supersecret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      VGW_S3_ENDPOINT: http://versitygw:7070
    volumes:
      - ./scripts:/scripts:ro
      - ./policies:/policies:ro
    networks:
      - s3lab
    restart: "no"

  awscli:
    image: amazon/aws-cli:2.36.16
    profiles: ["tools"]
    entrypoint: ["aws"]
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./.tmp/aws:/work
    working_dir: /work
    networks:
      - s3lab

volumes:
  minio-data:
  versitygw-iam:

networks:
  s3lab:
    name: mock-weka-s3lab
