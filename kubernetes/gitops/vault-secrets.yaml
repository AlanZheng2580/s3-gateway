# Assumes ricoberger/vault-secrets-operator and Vault KV v2 paths.
# Each VaultSecret creates an Opaque Secret with the same metadata.name.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: versitygw-admin-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  path: kv/versitygw/admin/reconciler
  keys:
    - accessKey
    - secretAccessKey
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: versitygw-user-a-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  path: kv/versitygw/users/user-a
  keys:
    - secretAccessKey
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: versitygw-user-b-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  path: kv/versitygw/users/user-b
  keys:
    - secretAccessKey
  type: Opaque

